# Manual only: intentionally no triggering/events block.
workflows:
  glass-lab-manual-debug:
    name: DATZON Glass Lab - Manual Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Prepare Android SDK and pinned packages
        script: |
          bash ci/prepare-android-sdk.sh
      - name: Compile and inspect debug APK
        script: |
          set -e
          bash ./gradlew --no-daemon --console=plain --max-workers=2 :app:assembleDebug :app:lintDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/logs/*
      - app/build/reports/lint-results-debug.html
